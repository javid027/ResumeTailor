org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a Kotlin build-tools-api bug where compileDebugKotlin fails
# with "Could not close incremental caches" / "Storage for [...] is already
# registered" on every Kotlin-based plugin (share_plus, file_picker,
# in_app_purchase_android) — this specific Kotlin/Gradle combination's
# incremental-cache closer is broken, not our build config. Full (non-
# incremental) Kotlin compilation avoids the buggy code path; it costs some
# rebuild speed, not correctness.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
